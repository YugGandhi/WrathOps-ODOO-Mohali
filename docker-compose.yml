version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: quickdesk-postgres
    environment:
      POSTGRES_DB: quickdesk
      POSTGRES_USER: quickdesk_user
      POSTGRES_PASSWORD: quickdesk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quickdesk-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickdesk-backend
    environment:
      DATABASE_URL: postgresql://quickdesk_user:quickdesk_password@postgres:5432/quickdesk
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      BASE_URL: http://localhost:5000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASS: your-app-password
      MAX_FILE_SIZE: 10485760
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - quickdesk-network
    restart: unless-stopped

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickdesk-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - quickdesk-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  quickdesk-network:
    driver: bridge 